<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baba Is You - Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            color: #fff;
        }

        h1 {
            margin-bottom: 10px;
            color: #ff6b9d;
            text-shadow: 0 0 10px #ff6b9d;
        }

        .info {
            margin-bottom: 20px;
            color: #88c0d0;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #game-canvas {
            border: 4px solid #4a4a6a;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(136, 192, 208, 0.3);
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            background: #4a4a6a;
            color: #fff;
            border: 2px solid #88c0d0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #88c0d0;
            color: #1a1a2e;
        }

        .rules-display {
            margin-top: 15px;
            padding: 15px;
            background: #2a2a4e;
            border-radius: 8px;
            min-width: 300px;
        }

        .rules-display h3 {
            color: #ff6b9d;
            margin-bottom: 10px;
        }

        .rules-display p {
            color: #a0d0a0;
            margin: 5px 0;
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 3px solid #ff6b9d;
            text-align: center;
            z-index: 100;
            display: none;
        }

        .message h2 {
            color: #ff6b9d;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .message button {
            margin-top: 15px;
        }

        .level-info {
            font-size: 18px;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a4e;
            border-radius: 8px;
            max-width: 600px;
            text-align: center;
        }

        .instructions h3 {
            color: #88c0d0;
            margin-bottom: 10px;
        }

        .instructions p {
            color: #ccc;
            line-height: 1.6;
        }

        .key {
            display: inline-block;
            padding: 2px 8px;
            background: #4a4a6a;
            border-radius: 4px;
            margin: 0 3px;
        }
    </style>
</head>
<body>
    <h1>🐰 BABA IS YOU 🐰</h1>
    <p class="level-info" id="level-info">Niveau 1</p>
    <p class="info">Pousse les mots pour changer les règles !</p>

    <div id="game-container">
        <canvas id="game-canvas" width="640" height="480"></canvas>

        <div class="controls">
            <button onclick="game.restart()">🔄 Recommencer (R)</button>
            <button onclick="game.undo()">↩️ Annuler (Z)</button>
            <button onclick="game.previousLevel()">⬅️ Niveau Précédent</button>
            <button onclick="game.nextLevel()">➡️ Niveau Suivant</button>
        </div>

        <div class="rules-display">
            <h3>📜 Règles Actives</h3>
            <div id="active-rules"></div>
        </div>

        <div class="instructions">
            <h3>Comment Jouer</h3>
            <p>
                Utilise <span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> ou <span class="key">ZQSD</span> pour te déplacer.<br>
                Pousse les mots pour créer des règles comme <strong>BABA IS YOU</strong> ou <strong>FLAG IS WIN</strong>.<br>
                <span class="key">R</span> pour recommencer, <span class="key">Z</span> pour annuler.
            </p>
        </div>
    </div>

    <div class="message" id="win-message">
        <h2>🎉 VICTOIRE ! 🎉</h2>
        <p>Tu as résolu le puzzle !</p>
        <button onclick="game.nextLevel()">Niveau Suivant</button>
        <button onclick="game.restart()">Rejouer</button>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const TILE_SIZE = 40;
        const GRID_WIDTH = 16;
        const GRID_HEIGHT = 12;

        // Types d'objets
        const ObjectType = {
            EMPTY: 0,
            // Entités (objets du jeu)
            BABA: 'baba',
            WALL: 'wall',
            ROCK: 'rock',
            FLAG: 'flag',
            WATER: 'water',
            LAVA: 'lava',
            // Mots - Noms
            TEXT_BABA: 'text_baba',
            TEXT_WALL: 'text_wall',
            TEXT_ROCK: 'text_rock',
            TEXT_FLAG: 'text_flag',
            TEXT_WATER: 'text_water',
            TEXT_LAVA: 'text_lava',
            // Mots - Opérateur
            TEXT_IS: 'text_is',
            // Mots - Propriétés
            TEXT_YOU: 'text_you',
            TEXT_WIN: 'text_win',
            TEXT_STOP: 'text_stop',
            TEXT_PUSH: 'text_push',
            TEXT_SINK: 'text_sink',
            TEXT_DEFEAT: 'text_defeat',
        };

        // Couleurs
        const Colors = {
            baba: '#ffffff',
            wall: '#8b6914',
            rock: '#a0522d',
            flag: '#ffd700',
            water: '#4169e1',
            lava: '#ff4500',
            text_baba: '#ff9999',
            text_wall: '#d4a574',
            text_rock: '#cd853f',
            text_flag: '#ffeb3b',
            text_water: '#87ceeb',
            text_lava: '#ff7043',
            text_is: '#ffffff',
            text_you: '#ff69b4',
            text_win: '#ffff00',
            text_stop: '#8b4513',
            text_push: '#90ee90',
            text_sink: '#1e90ff',
            text_defeat: '#ff0000',
        };

        // Mapping texte -> entité
        const TextToEntity = {
            'text_baba': 'baba',
            'text_wall': 'wall',
            'text_rock': 'rock',
            'text_flag': 'flag',
            'text_water': 'water',
            'text_lava': 'lava',
        };

        // ==================== NIVEAUX ====================
        const levels = [
            {
                name: "Niveau 1 - Introduction",
                description: "Atteins le drapeau pour gagner !",
                grid: [
                    // Format: [x, y, type]
                    // Règle BABA IS YOU (horizontale en haut à gauche)
                    [1, 1, 'text_baba'], [2, 1, 'text_is'], [3, 1, 'text_you'],
                    // Règle FLAG IS WIN (horizontale en haut à droite)
                    [10, 1, 'text_flag'], [11, 1, 'text_is'], [12, 1, 'text_win'],
                    // Règle WALL IS STOP (verticale à droite)
                    [14, 3, 'text_wall'], [14, 4, 'text_is'], [14, 5, 'text_stop'],
                    // Baba
                    [3, 6, 'baba'],
                    // Murs
                    [6, 4, 'wall'], [6, 5, 'wall'], [6, 6, 'wall'], [6, 7, 'wall'], [6, 8, 'wall'],
                    [7, 4, 'wall'], [8, 4, 'wall'],
                    [7, 8, 'wall'], [8, 8, 'wall'],
                    // Drapeau
                    [10, 6, 'flag'],
                ]
            },
            {
                name: "Niveau 2 - Transformation",
                description: "Change les règles pour gagner !",
                grid: [
                    // Règle BABA IS YOU
                    [1, 1, 'text_baba'], [2, 1, 'text_is'], [3, 1, 'text_you'],
                    // Règle WALL IS STOP
                    [1, 3, 'text_wall'], [2, 3, 'text_is'], [3, 3, 'text_stop'],
                    // Mots séparés à pousser pour créer ROCK IS PUSH
                    [8, 1, 'text_rock'],
                    [10, 1, 'text_push'],
                    // IS supplémentaire
                    [12, 5, 'text_is'],
                    // FLAG IS WIN (à reconstruire)
                    [13, 8, 'text_flag'],
                    [13, 10, 'text_win'],
                    // Baba
                    [2, 6, 'baba'],
                    // Murs formant un labyrinthe
                    [5, 2, 'wall'], [5, 3, 'wall'], [5, 4, 'wall'], [5, 5, 'wall'], [5, 6, 'wall'], [5, 7, 'wall'], [5, 8, 'wall'],
                    [6, 8, 'wall'], [7, 8, 'wall'], [8, 8, 'wall'], [9, 8, 'wall'], [10, 8, 'wall'],
                    // Rocher bloquant le chemin
                    [7, 5, 'rock'],
                    [8, 5, 'rock'],
                    // Drapeau derrière les rochers
                    [9, 5, 'flag'],
                ]
            },
            {
                name: "Niveau 3 - Danger",
                description: "L'eau est dangereuse... ou pas ?",
                grid: [
                    // Règle BABA IS YOU
                    [1, 1, 'text_baba'], [2, 1, 'text_is'], [3, 1, 'text_you'],
                    // Règle FLAG IS WIN
                    [1, 3, 'text_flag'], [2, 3, 'text_is'], [3, 3, 'text_win'],
                    // Règle WATER IS SINK (à modifier)
                    [10, 1, 'text_water'], [11, 1, 'text_is'], [12, 1, 'text_sink'],
                    // Règle ROCK IS PUSH
                    [10, 3, 'text_rock'], [11, 3, 'text_is'], [12, 3, 'text_push'],
                    // STOP disponible
                    [14, 5, 'text_stop'],
                    // Baba
                    [2, 6, 'baba'],
                    // Eau (obstacle)
                    [5, 5, 'water'], [6, 5, 'water'], [7, 5, 'water'], [8, 5, 'water'],
                    [5, 6, 'water'], [6, 6, 'water'], [7, 6, 'water'], [8, 6, 'water'],
                    [5, 7, 'water'], [6, 7, 'water'], [7, 7, 'water'], [8, 7, 'water'],
                    // Rochers pour traverser
                    [3, 8, 'rock'],
                    [3, 9, 'rock'],
                    // Drapeau de l'autre côté
                    [12, 6, 'flag'],
                ]
            }
        ];

        // ==================== CLASSE DU JEU ====================
        class BabaGame {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.currentLevel = 0;
                this.grid = [];
                this.history = [];
                this.rules = new Map();
                this.won = false;

                this.loadLevel(this.currentLevel);
                this.setupInput();
                this.render();
            }

            // Charger un niveau
            loadLevel(levelIndex) {
                if (levelIndex < 0 || levelIndex >= levels.length) return;

                this.currentLevel = levelIndex;
                this.grid = [];
                this.history = [];
                this.won = false;

                // Initialiser la grille vide
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    this.grid[y] = [];
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        this.grid[y][x] = [];
                    }
                }

                // Placer les objets
                const level = levels[levelIndex];
                for (const [x, y, type] of level.grid) {
                    if (x >= 0 && x < GRID_WIDTH && y >= 0 && y < GRID_HEIGHT) {
                        this.grid[y][x].push({ type, id: Math.random() });
                    }
                }

                this.parseRules();
                this.updateLevelInfo();
                this.render();

                document.getElementById('win-message').style.display = 'none';
            }

            // Mettre à jour les infos du niveau
            updateLevelInfo() {
                const level = levels[this.currentLevel];
                document.getElementById('level-info').textContent = level.name;
            }

            // Parser les règles du jeu
            parseRules() {
                this.rules.clear();

                // Chercher les règles horizontales: NOUN IS PROPERTY
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH - 2; x++) {
                        const cell1 = this.grid[y][x];
                        const cell2 = this.grid[y][x + 1];
                        const cell3 = this.grid[y][x + 2];

                        if (cell1.length && cell2.length && cell3.length) {
                            const noun = cell1.find(o => o.type.startsWith('text_') && o.type !== 'text_is' && !this.isProperty(o.type));
                            const is = cell2.find(o => o.type === 'text_is');
                            const prop = cell3.find(o => this.isProperty(o.type) || (o.type.startsWith('text_') && o.type !== 'text_is'));

                            if (noun && is && prop) {
                                this.addRule(noun.type, prop.type);
                            }
                        }
                    }
                }

                // Chercher les règles verticales: NOUN IS PROPERTY
                for (let y = 0; y < GRID_HEIGHT - 2; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        const cell1 = this.grid[y][x];
                        const cell2 = this.grid[y + 1][x];
                        const cell3 = this.grid[y + 2][x];

                        if (cell1.length && cell2.length && cell3.length) {
                            const noun = cell1.find(o => o.type.startsWith('text_') && o.type !== 'text_is' && !this.isProperty(o.type));
                            const is = cell2.find(o => o.type === 'text_is');
                            const prop = cell3.find(o => this.isProperty(o.type) || (o.type.startsWith('text_') && o.type !== 'text_is'));

                            if (noun && is && prop) {
                                this.addRule(noun.type, prop.type);
                            }
                        }
                    }
                }

                this.updateRulesDisplay();
            }

            isProperty(type) {
                return ['text_you', 'text_win', 'text_stop', 'text_push', 'text_sink', 'text_defeat'].includes(type);
            }

            addRule(noun, property) {
                const entity = TextToEntity[noun];
                if (!entity) return;

                if (!this.rules.has(entity)) {
                    this.rules.set(entity, new Set());
                }

                // Si la propriété est une entité (transformation)
                if (TextToEntity[property]) {
                    this.rules.get(entity).add('transform_' + TextToEntity[property]);
                } else {
                    const prop = property.replace('text_', '');
                    this.rules.get(entity).add(prop);
                }
            }

            hasProperty(type, property) {
                // Tous les textes sont poussables par défaut
                if (type.startsWith('text_') && property === 'push') {
                    return true;
                }

                const props = this.rules.get(type);
                return props ? props.has(property) : false;
            }

            updateRulesDisplay() {
                const container = document.getElementById('active-rules');
                container.innerHTML = '';

                for (const [entity, props] of this.rules) {
                    for (const prop of props) {
                        const p = document.createElement('p');
                        const displayProp = prop.startsWith('transform_') ? prop.replace('transform_', '') : prop;
                        p.textContent = `${entity.toUpperCase()} IS ${displayProp.toUpperCase()}`;
                        container.appendChild(p);
                    }
                }

                if (container.children.length === 0) {
                    container.innerHTML = '<p style="color: #666">Aucune règle active</p>';
                }
            }

            // Sauvegarder l'état pour l'annulation
            saveState() {
                const state = JSON.stringify(this.grid);
                this.history.push(state);
                if (this.history.length > 100) {
                    this.history.shift();
                }
            }

            // Annuler le dernier mouvement
            undo() {
                if (this.history.length === 0) return;

                const state = this.history.pop();
                this.grid = JSON.parse(state);
                this.parseRules();
                this.render();
            }

            // Gérer les entrées clavier
            setupInput() {
                document.addEventListener('keydown', (e) => {
                    if (this.won) return;

                    let dx = 0, dy = 0;

                    switch (e.key.toLowerCase()) {
                        case 'arrowup':
                        case 'z':
                        case 'w':
                            dy = -1;
                            break;
                        case 'arrowdown':
                        case 's':
                            dy = 1;
                            break;
                        case 'arrowleft':
                        case 'q':
                        case 'a':
                            dx = -1;
                            break;
                        case 'arrowright':
                        case 'd':
                            dx = 1;
                            break;
                        case 'r':
                            this.restart();
                            return;
                        case 'u':
                            this.undo();
                            return;
                    }

                    if (dx !== 0 || dy !== 0) {
                        e.preventDefault();
                        this.move(dx, dy);
                    }
                });
            }

            // Déplacer tous les objets "YOU"
            move(dx, dy) {
                this.saveState();

                // Trouver tous les objets contrôlés par le joueur
                const youObjects = [];
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        for (const obj of this.grid[y][x]) {
                            if (this.hasProperty(obj.type, 'you')) {
                                youObjects.push({ x, y, obj });
                            }
                        }
                    }
                }

                if (youObjects.length === 0) {
                    // Plus de "YOU" = défaite
                    return;
                }

                // Trier pour éviter les conflits de mouvement
                if (dx > 0) youObjects.sort((a, b) => b.x - a.x);
                if (dx < 0) youObjects.sort((a, b) => a.x - b.x);
                if (dy > 0) youObjects.sort((a, b) => b.y - a.y);
                if (dy < 0) youObjects.sort((a, b) => a.y - b.y);

                // Déplacer chaque objet YOU
                for (const { x, y, obj } of youObjects) {
                    this.tryMove(x, y, obj, dx, dy);
                }

                // Appliquer les transformations
                this.applyTransformations();

                // Vérifier les interactions (sink, defeat)
                this.checkInteractions();

                // Recalculer les règles
                this.parseRules();

                // Vérifier la victoire
                this.checkWin();

                this.render();
            }

            // Essayer de déplacer un objet
            tryMove(x, y, obj, dx, dy) {
                const newX = x + dx;
                const newY = y + dy;

                // Vérifier les limites
                if (newX < 0 || newX >= GRID_WIDTH || newY < 0 || newY >= GRID_HEIGHT) {
                    return false;
                }

                // Vérifier les obstacles
                const targetCell = this.grid[newY][newX];

                for (const targetObj of targetCell) {
                    // Si l'objet est STOP, on ne peut pas passer
                    if (this.hasProperty(targetObj.type, 'stop')) {
                        return false;
                    }

                    // Si l'objet est PUSH, essayer de le pousser
                    if (this.hasProperty(targetObj.type, 'push')) {
                        if (!this.tryMove(newX, newY, targetObj, dx, dy)) {
                            return false;
                        }
                    }
                }

                // Effectuer le mouvement
                const index = this.grid[y][x].indexOf(obj);
                if (index > -1) {
                    this.grid[y][x].splice(index, 1);
                    this.grid[newY][newX].push(obj);
                }

                return true;
            }

            // Appliquer les transformations (NOUN IS NOUN)
            applyTransformations() {
                for (const [entity, props] of this.rules) {
                    for (const prop of props) {
                        if (prop.startsWith('transform_')) {
                            const newType = prop.replace('transform_', '');

                            for (let y = 0; y < GRID_HEIGHT; y++) {
                                for (let x = 0; x < GRID_WIDTH; x++) {
                                    for (const obj of this.grid[y][x]) {
                                        if (obj.type === entity) {
                                            obj.type = newType;
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // Vérifier les interactions (SINK, DEFEAT)
            checkInteractions() {
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        const cell = this.grid[y][x];

                        // SINK: détruit tout ce qui rentre dedans
                        const sinkObj = cell.find(o => this.hasProperty(o.type, 'sink'));
                        if (sinkObj) {
                            const others = cell.filter(o => o !== sinkObj && !o.type.startsWith('text_'));
                            if (others.length > 0) {
                                // Tout coule !
                                this.grid[y][x] = cell.filter(o => o.type.startsWith('text_'));
                            }
                        }

                        // DEFEAT: tue YOU
                        const defeatObj = cell.find(o => this.hasProperty(o.type, 'defeat'));
                        const youObj = cell.find(o => this.hasProperty(o.type, 'you'));
                        if (defeatObj && youObj) {
                            this.grid[y][x] = cell.filter(o => o !== youObj);
                        }
                    }
                }
            }

            // Vérifier la condition de victoire
            checkWin() {
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        const cell = this.grid[y][x];
                        const hasYou = cell.some(o => this.hasProperty(o.type, 'you'));
                        const hasWin = cell.some(o => this.hasProperty(o.type, 'win'));

                        if (hasYou && hasWin) {
                            this.won = true;
                            setTimeout(() => {
                                document.getElementById('win-message').style.display = 'block';
                            }, 300);
                            return;
                        }
                    }
                }
            }

            // Recommencer le niveau
            restart() {
                this.loadLevel(this.currentLevel);
            }

            // Niveau suivant
            nextLevel() {
                if (this.currentLevel < levels.length - 1) {
                    this.loadLevel(this.currentLevel + 1);
                } else {
                    alert('Félicitations ! Tu as terminé tous les niveaux !');
                }
            }

            // Niveau précédent
            previousLevel() {
                if (this.currentLevel > 0) {
                    this.loadLevel(this.currentLevel - 1);
                }
            }

            // Rendu graphique
            render() {
                // Fond
                this.ctx.fillStyle = '#1a1a2e';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Grille de fond
                this.ctx.strokeStyle = '#2a2a4e';
                this.ctx.lineWidth = 1;
                for (let x = 0; x <= GRID_WIDTH; x++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x * TILE_SIZE, 0);
                    this.ctx.lineTo(x * TILE_SIZE, GRID_HEIGHT * TILE_SIZE);
                    this.ctx.stroke();
                }
                for (let y = 0; y <= GRID_HEIGHT; y++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y * TILE_SIZE);
                    this.ctx.lineTo(GRID_WIDTH * TILE_SIZE, y * TILE_SIZE);
                    this.ctx.stroke();
                }

                // Dessiner les objets
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        for (const obj of this.grid[y][x]) {
                            this.drawObject(x, y, obj);
                        }
                    }
                }
            }

            drawObject(x, y, obj) {
                const px = x * TILE_SIZE;
                const py = y * TILE_SIZE;
                const padding = 2;

                const color = Colors[obj.type] || '#ffffff';

                if (obj.type.startsWith('text_')) {
                    // Dessiner un bloc de texte
                    this.ctx.fillStyle = '#333';
                    this.ctx.fillRect(px + padding, py + padding, TILE_SIZE - padding * 2, TILE_SIZE - padding * 2);

                    this.ctx.strokeStyle = color;
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(px + padding, py + padding, TILE_SIZE - padding * 2, TILE_SIZE - padding * 2);

                    // Texte
                    this.ctx.fillStyle = color;
                    this.ctx.font = 'bold 10px Courier New';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';

                    const text = obj.type.replace('text_', '').toUpperCase();
                    this.ctx.fillText(text, px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                } else {
                    // Dessiner une entité
                    this.ctx.fillStyle = color;

                    switch (obj.type) {
                        case 'baba':
                            // Lapin mignon
                            this.ctx.beginPath();
                            this.ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2 + 5, 12, 0, Math.PI * 2);
                            this.ctx.fill();
                            // Oreilles
                            this.ctx.fillRect(px + 12, py + 5, 4, 12);
                            this.ctx.fillRect(px + 24, py + 5, 4, 12);
                            // Yeux
                            this.ctx.fillStyle = '#ff6b9d';
                            this.ctx.beginPath();
                            this.ctx.arc(px + 16, py + 22, 3, 0, Math.PI * 2);
                            this.ctx.arc(px + 24, py + 22, 3, 0, Math.PI * 2);
                            this.ctx.fill();
                            break;

                        case 'wall':
                            // Brique
                            this.ctx.fillRect(px + padding, py + padding, TILE_SIZE - padding * 2, TILE_SIZE - padding * 2);
                            this.ctx.strokeStyle = '#5a4a0a';
                            this.ctx.lineWidth = 2;
                            this.ctx.strokeRect(px + padding, py + padding, TILE_SIZE - padding * 2, TILE_SIZE - padding * 2);
                            // Lignes de brique
                            this.ctx.beginPath();
                            this.ctx.moveTo(px + padding, py + TILE_SIZE / 2);
                            this.ctx.lineTo(px + TILE_SIZE - padding, py + TILE_SIZE / 2);
                            this.ctx.moveTo(px + TILE_SIZE / 2, py + padding);
                            this.ctx.lineTo(px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                            this.ctx.moveTo(px + TILE_SIZE / 4, py + TILE_SIZE / 2);
                            this.ctx.lineTo(px + TILE_SIZE / 4, py + TILE_SIZE - padding);
                            this.ctx.moveTo(px + 3 * TILE_SIZE / 4, py + TILE_SIZE / 2);
                            this.ctx.lineTo(px + 3 * TILE_SIZE / 4, py + TILE_SIZE - padding);
                            this.ctx.stroke();
                            break;

                        case 'rock':
                            // Rocher
                            this.ctx.beginPath();
                            this.ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, 15, 0, Math.PI * 2);
                            this.ctx.fill();
                            this.ctx.strokeStyle = '#8b4513';
                            this.ctx.lineWidth = 2;
                            this.ctx.stroke();
                            break;

                        case 'flag':
                            // Drapeau
                            this.ctx.fillStyle = '#8b4513';
                            this.ctx.fillRect(px + TILE_SIZE / 2 - 2, py + 8, 4, 26);
                            this.ctx.fillStyle = color;
                            this.ctx.beginPath();
                            this.ctx.moveTo(px + TILE_SIZE / 2, py + 8);
                            this.ctx.lineTo(px + TILE_SIZE - 5, py + 15);
                            this.ctx.lineTo(px + TILE_SIZE / 2, py + 22);
                            this.ctx.closePath();
                            this.ctx.fill();
                            break;

                        case 'water':
                            // Eau
                            this.ctx.fillRect(px + padding, py + padding, TILE_SIZE - padding * 2, TILE_SIZE - padding * 2);
                            // Vagues
                            this.ctx.strokeStyle = '#87ceeb';
                            this.ctx.lineWidth = 2;
                            this.ctx.beginPath();
                            for (let i = 0; i < 3; i++) {
                                const waveY = py + 10 + i * 10;
                                this.ctx.moveTo(px + 5, waveY);
                                this.ctx.quadraticCurveTo(px + TILE_SIZE / 4, waveY - 5, px + TILE_SIZE / 2, waveY);
                                this.ctx.quadraticCurveTo(px + 3 * TILE_SIZE / 4, waveY + 5, px + TILE_SIZE - 5, waveY);
                            }
                            this.ctx.stroke();
                            break;

                        case 'lava':
                            // Lave
                            this.ctx.fillRect(px + padding, py + padding, TILE_SIZE - padding * 2, TILE_SIZE - padding * 2);
                            // Bulles
                            this.ctx.fillStyle = '#ffff00';
                            this.ctx.beginPath();
                            this.ctx.arc(px + 12, py + 15, 4, 0, Math.PI * 2);
                            this.ctx.arc(px + 28, py + 25, 3, 0, Math.PI * 2);
                            this.ctx.arc(px + 18, py + 30, 2, 0, Math.PI * 2);
                            this.ctx.fill();
                            break;

                        default:
                            // Par défaut: carré
                            this.ctx.fillRect(px + padding, py + padding, TILE_SIZE - padding * 2, TILE_SIZE - padding * 2);
                    }
                }

                // Indicateur si l'objet a YOU
                if (this.hasProperty(obj.type, 'you') && !obj.type.startsWith('text_')) {
                    this.ctx.strokeStyle = '#ff69b4';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                }
            }
        }

        // Démarrer le jeu
        const game = new BabaGame();
    </script>
</body>
</html>
