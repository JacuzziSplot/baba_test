        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            color: #fff;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
            background: linear-gradient(90deg, #ff6b9d, #c44569, #ff6b9d);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.5);
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .info {
            margin-bottom: 15px;
            color: #88c0d0;
            font-size: 10px;
            text-shadow: 0 0 10px rgba(136, 192, 208, 0.5);
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow:
                0 0 50px rgba(136, 192, 208, 0.3),
                0 0 100px rgba(255, 107, 157, 0.2),
                inset 0 0 50px rgba(0, 0, 0, 0.5);
        }

        #game-canvas {
            display: block;
            border: 4px solid;
            border-image: linear-gradient(45deg, #4a4a6a, #88c0d0, #ff6b9d, #4a4a6a) 1;

        .controls {

            flex-wrap: wrap;
            justify-content: center;
        }

            font-size: 10px;
            font-family: 'Press Start 2P', 'Courier New', monospace;

            color: #fff;
            border: 2px solid #88c0d0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        button:hover {
            background: linear-gradient(180deg, #88c0d0 0%, #5a8a9a 100%);
            color: #1a1a2e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(136, 192, 208, 0.4);
        }

        button:active {

        }

            margin-top: 10px;
            padding: 15px;
            background: linear-gradient(180deg, rgba(42, 42, 78, 0.9) 0%, rgba(26, 26, 46, 0.9) 100%);

            border: 2px solid #4a4a6a;
            min-width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .rules-display h3 {
            color: #ff6b9d;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .rules-display p {
            color: #a0d0a0;
            margin: 5px 0;
            font-size: 9px;
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(180deg, rgba(20, 20, 40, 0.98) 0%, rgba(10, 10, 30, 0.98) 100%);
            padding: 50px;
            border-radius: 20px;
            border: 4px solid #ff6b9d;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 50px rgba(255, 107, 157, 0.5);

            font-size: 24px;
            margin-bottom: 20px;

            margin-bottom: 20px;
            color: #88c0d0;

            color: #ffd700;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);

            color: #aaa;

            max-width: 500px;
            text-align: center;

            text-align: center;

            color: #88c0d0;
            margin-bottom: 10px;
            font-size: 11px;
        }

        .instructions p {
            color: #ccc;
            line-height: 2;
            font-size: 8px;

            padding: 4px 8px;
            background: linear-gradient(180deg, #5a5a7a 0%, #3a3a5a 100%);
            border-radius: 4px;
            margin: 0 3px;

</head>

        const starsCanvas = document.getElementById('stars-canvas');

        function resizeStars() {
            starsCanvas.width = window.innerWidth;
            starsCanvas.height = window.innerHeight;
        }
        resizeStars();
        window.addEventListener('resize', resizeStars);

        const stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.5 + 0.1,
                brightness: Math.random()
            });
        }

        function animateStars() {
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);

            for (const star of stars) {
                star.brightness += (Math.random() - 0.5) * 0.1;
                star.brightness = Math.max(0.3, Math.min(1, star.brightness));

                starsCtx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                starsCtx.fill();

                star.y += star.speed;
                if (star.y > starsCanvas.height) {
                    star.y = 0;
                    star.x = Math.random() * starsCanvas.width;
                }
            }

            requestAnimationFrame(animateStars);
        }
        animateStars();

        // ==================== CLASSE DU JEU ====================
        class BabaGame {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.currentLevel = 0;
                this.grid = [];
                this.history = [];
                this.rules = new Map();
                this.won = false;
                this.moveCount = 0;
                this.animationFrame = 0;

                this.loadLevel(this.currentLevel);
                this.setupInput();
                this.gameLoop();
            }

            loadLevel(levelIndex) {
                if (levelIndex < 0 || levelIndex >= levels.length) return;

                this.currentLevel = levelIndex;
                this.grid = [];
                this.history = [];
                this.won = false;
                this.moveCount = 0;

                for (let y = 0; y < GRID_HEIGHT; y++) {
                    this.grid[y] = [];
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        this.grid[y][x] = [];
                    }
                }

                const level = levels[levelIndex];
                for (const [x, y, type] of level.grid) {
                    if (x >= 0 && x < GRID_WIDTH && y >= 0 && y < GRID_HEIGHT) {
                        this.grid[y][x].push({ type, id: Math.random() });
                    }
                }

                this.parseRules();
                this.updateLevelInfo();
                this.updateMoveCount();

                document.getElementById('win-message').classList.remove('show');
            }

            updateLevelInfo() {
                const level = levels[this.currentLevel];
                const difficultySpan = `<span class="difficulty ${level.difficulty}">${level.difficulty.toUpperCase()}</span>`;
                document.getElementById('level-info').innerHTML = level.name + difficultySpan;
                document.getElementById('level-description').textContent = level.description;
            }

            updateMoveCount() {
                document.getElementById('move-count').textContent = this.moveCount;
            }

            parseRules() {
                this.rules.clear();

                // Règles horizontales avec support AND
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH - 2; x++) {
                        this.parseRuleAt(x, y, 1, 0);
                    }
                }

                // Règles verticales avec support AND
                for (let y = 0; y < GRID_HEIGHT - 2; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        this.parseRuleAt(x, y, 0, 1);
                    }
                }

                this.updateRulesDisplay();
            }

            parseRuleAt(startX, startY, dx, dy) {
                const nouns = [];
                let foundIs = false;
                const properties = [];

                let x = startX;
                let y = startY;

                // Parser la première partie (noms)
                while (x >= 0 && x < GRID_WIDTH && y >= 0 && y < GRID_HEIGHT) {
                    const cell = this.grid[y][x];
                    if (!cell.length) break;

                    const textObj = cell.find(o => o.type.startsWith('text_'));
                    if (!textObj) break;

                    if (textObj.type === 'text_is') {
                        foundIs = true;
                        x += dx;
                        y += dy;
                        break;
                    } else if (textObj.type === 'text_and') {
                        // Continue
                    } else if (this.isNoun(textObj.type)) {
                        nouns.push(textObj.type);
                    } else {
                        break;
                    }

                    x += dx;
                    y += dy;
                }

                if (!foundIs || nouns.length === 0) return;

                // Parser la deuxième partie (propriétés ou transformations)
                while (x >= 0 && x < GRID_WIDTH && y >= 0 && y < GRID_HEIGHT) {
                    const cell = this.grid[y][x];
                    if (!cell.length) break;

                    const textObj = cell.find(o => o.type.startsWith('text_'));
                    if (!textObj) break;

                    if (textObj.type === 'text_and') {
                        // Continue
                    } else if (this.isProperty(textObj.type) || this.isNoun(textObj.type)) {
                        properties.push(textObj.type);
                    } else {
                        break;
                    }

                    x += dx;
                    y += dy;
                }

                // Créer les règles
                for (const noun of nouns) {
                    for (const prop of properties) {
                        this.addRule(noun, prop);
                    }
                }
            }

            isNoun(type) {
                return TextToEntity[type] !== undefined;
            }

            isProperty(type) {
                return ['text_you', 'text_win', 'text_stop', 'text_push', 'text_sink', 'text_defeat', 'text_melt', 'text_hot', 'text_open', 'text_shut'].includes(type);
            }

            addRule(noun, property) {
                const entity = TextToEntity[noun];
                if (!entity) return;

                if (!this.rules.has(entity)) {
                    this.rules.set(entity, new Set());
                }

                if (TextToEntity[property]) {
                    this.rules.get(entity).add('transform_' + TextToEntity[property]);
                } else {
                    const prop = property.replace('text_', '');
                    this.rules.get(entity).add(prop);
                }
            }

            hasProperty(type, property) {
                if (type.startsWith('text_') && property === 'push') {
                    return true;
                }

                const props = this.rules.get(type);
                return props ? props.has(property) : false;
            }

            updateRulesDisplay() {
                const container = document.getElementById('active-rules');
                container.innerHTML = '';

                const rulesList = [];
                for (const [entity, props] of this.rules) {
                    for (const prop of props) {
                        const displayProp = prop.startsWith('transform_') ? prop.replace('transform_', '') : prop;
                        rulesList.push(`${entity.toUpperCase()} IS ${displayProp.toUpperCase()}`);
                    }
                }

                if (rulesList.length === 0) {
                    container.innerHTML = '<p style="color: #666">Aucune règle active</p>';
                } else {
                    container.innerHTML = rulesList.map(r => `<p>${r}</p>`).join('');
                }
            }

            saveState() {
                const state = JSON.stringify(this.grid);
                this.history.push(state);
                if (this.history.length > 100) {
                    this.history.shift();
                }
            }

            undo() {
                if (this.history.length === 0 || this.won) return;

                const state = this.history.pop();
                this.grid = JSON.parse(state);
                this.moveCount = Math.max(0, this.moveCount - 1);
                this.updateMoveCount();
                this.parseRules();
            }

            setupInput() {
                document.addEventListener('keydown', (e) => {
                    if (this.won) return;

                    let dx = 0, dy = 0;

                    switch (e.key.toLowerCase()) {
                        case 'arrowup': case 'z': case 'w': dy = -1; break;
                        case 'arrowdown': case 's': dy = 1; break;
                        case 'arrowleft': case 'q': case 'a': dx = -1; break;
                        case 'arrowright': case 'd': dx = 1; break;
                        case 'r': this.restart(); return;
                        case 'u': this.undo(); return;
                    }

                    if (dx !== 0 || dy !== 0) {
                        e.preventDefault();
                        this.move(dx, dy);
                    }
                });
            }

            move(dx, dy) {
                this.saveState();

                const youObjects = [];
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        for (const obj of this.grid[y][x]) {
                            if (this.hasProperty(obj.type, 'you')) {
                                youObjects.push({ x, y, obj });
                            }
                        }
                    }
                }

                if (youObjects.length === 0) return;

                if (dx > 0) youObjects.sort((a, b) => b.x - a.x);
                if (dx < 0) youObjects.sort((a, b) => a.x - b.x);
                if (dy > 0) youObjects.sort((a, b) => b.y - a.y);
                if (dy < 0) youObjects.sort((a, b) => a.y - b.y);

                let moved = false;
                for (const { x, y, obj } of youObjects) {
                    if (this.tryMove(x, y, obj, dx, dy)) {
                        moved = true;
                    }
                }

                if (moved) {
                    this.moveCount++;
                    this.updateMoveCount();
                }

                this.applyTransformations();
                this.checkInteractions();
                this.parseRules();
                this.checkWin();
            }

            tryMove(x, y, obj, dx, dy) {
                const newX = x + dx;
                const newY = y + dy;

                if (newX < 0 || newX >= GRID_WIDTH || newY < 0 || newY >= GRID_HEIGHT) {
                    return false;
                }

                const targetCell = this.grid[newY][newX];

                // Vérifier SHUT (portes fermées)
                for (const targetObj of targetCell) {
                    if (this.hasProperty(targetObj.type, 'shut')) {
                        // Vérifier si on a OPEN
                        if (this.hasProperty(obj.type, 'open')) {
                            // Ouvrir la porte (détruire les deux)
                            this.grid[newY][newX] = targetCell.filter(o => o !== targetObj);
                            const index = this.grid[y][x].indexOf(obj);
                            if (index > -1) {
                                this.grid[y][x].splice(index, 1);
                            }
                            return true;
                        }
                        return false;
                    }
                }

                for (const targetObj of [...targetCell]) {
                    if (this.hasProperty(targetObj.type, 'stop')) {
                        return false;
                    }

                    if (this.hasProperty(targetObj.type, 'push')) {
                        if (!this.tryMove(newX, newY, targetObj, dx, dy)) {
                            return false;
                        }
                    }
                }

                const index = this.grid[y][x].indexOf(obj);
                if (index > -1) {
                    this.grid[y][x].splice(index, 1);
                    this.grid[newY][newX].push(obj);
                }

                return true;
            }

            applyTransformations() {
                for (const [entity, props] of this.rules) {
                    for (const prop of props) {
                        if (prop.startsWith('transform_')) {
                            const newType = prop.replace('transform_', '');
                            for (let y = 0; y < GRID_HEIGHT; y++) {
                                for (let x = 0; x < GRID_WIDTH; x++) {
                                    for (const obj of this.grid[y][x]) {
                                        if (obj.type === entity) {
                                            obj.type = newType;
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }

            checkInteractions() {
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        const cell = this.grid[y][x];

                        // HOT + MELT = destruction
                        const hotObj = cell.find(o => this.hasProperty(o.type, 'hot'));
                        const meltObj = cell.find(o => this.hasProperty(o.type, 'melt'));
                        if (hotObj && meltObj && hotObj !== meltObj) {
                            this.grid[y][x] = cell.filter(o => o !== meltObj);
                        }

                        // SINK
                        const sinkObj = cell.find(o => this.hasProperty(o.type, 'sink'));
                        if (sinkObj) {
                            const others = cell.filter(o => o !== sinkObj && !o.type.startsWith('text_'));
                            if (others.length > 0) {
                                this.grid[y][x] = cell.filter(o => o.type.startsWith('text_'));
                            }
                        }

                        // DEFEAT
                        const defeatObj = cell.find(o => this.hasProperty(o.type, 'defeat'));
                        const youObj = cell.find(o => this.hasProperty(o.type, 'you'));
                        if (defeatObj && youObj && defeatObj !== youObj) {
                            this.grid[y][x] = cell.filter(o => o !== youObj);
                        }
                    }
                }
            }

            checkWin() {
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        const cell = this.grid[y][x];
                        const hasYou = cell.some(o => this.hasProperty(o.type, 'you'));
                        const hasWin = cell.some(o => this.hasProperty(o.type, 'win'));

                        if (hasYou && hasWin) {
                            this.won = true;
                            document.getElementById('win-stats').textContent = `Complété en ${this.moveCount} mouvements !`;
                            setTimeout(() => {
                                document.getElementById('win-message').classList.add('show');
                            }, 300);
                            return;
                        }
                    }
                }
            }

            restart() {
                this.loadLevel(this.currentLevel);
            }

            nextLevel() {
                if (this.currentLevel < levels.length - 1) {
                    this.loadLevel(this.currentLevel + 1);
                } else {
                    alert('FELICITATIONS ! Tu as terminé tous les niveaux !');
                }
            }

            previousLevel() {
                if (this.currentLevel > 0) {
                    this.loadLevel(this.currentLevel - 1);
                }
            }

            gameLoop() {
                this.animationFrame++;
                this.render();
                requestAnimationFrame(() => this.gameLoop());
            }

            render() {
                // Fond avec dégradé
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                gradient.addColorStop(0, '#0d0d1a');
                gradient.addColorStop(0.5, '#1a1a3e');
                gradient.addColorStop(1, '#0d0d1a');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Grille subtile
                this.ctx.strokeStyle = 'rgba(74, 74, 106, 0.3)';
                this.ctx.lineWidth = 1;
                for (let x = 0; x <= GRID_WIDTH; x++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x * TILE_SIZE, 0);
                    this.ctx.lineTo(x * TILE_SIZE, GRID_HEIGHT * TILE_SIZE);
                    this.ctx.stroke();
                }
                for (let y = 0; y <= GRID_HEIGHT; y++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y * TILE_SIZE);
                    this.ctx.lineTo(GRID_WIDTH * TILE_SIZE, y * TILE_SIZE);
                    this.ctx.stroke();
                }

                // Dessiner les objets
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    for (let x = 0; x < GRID_WIDTH; x++) {
                        for (const obj of this.grid[y][x]) {
                            this.drawObject(x, y, obj);
                        }
                    }
                }
            }

            drawObject(x, y, obj) {
                const px = x * TILE_SIZE;
                const py = y * TILE_SIZE;
                const padding = 2;
                const size = TILE_SIZE - padding * 2;
                const centerX = px + TILE_SIZE / 2;
                const centerY = py + TILE_SIZE / 2;

                const colorData = Colors[obj.type];

                // Animation de flottement pour les objets YOU
                let offsetY = 0;
                if (this.hasProperty(obj.type, 'you') && !obj.type.startsWith('text_')) {
                    offsetY = Math.sin(this.animationFrame * 0.1 + obj.id * 10) * 2;
                }

                if (obj.type.startsWith('text_')) {
                    // Bloc de texte avec effet néon
                    const color = typeof colorData === 'string' ? colorData : '#ffffff';

                    // Ombre portée
                    this.ctx.shadowColor = color;
                    this.ctx.shadowBlur = 10;

                    // Fond du bloc
                    const textGradient = this.ctx.createLinearGradient(px, py, px, py + TILE_SIZE);
                    textGradient.addColorStop(0, '#2a2a4a');
                    textGradient.addColorStop(1, '#1a1a2a');
                    this.ctx.fillStyle = textGradient;
                    this.ctx.fillRect(px + padding, py + padding, size, size);

                    // Bordure lumineuse
                    this.ctx.strokeStyle = color;
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(px + padding, py + padding, size, size);

                    // Texte
                    this.ctx.shadowBlur = 15;
                    this.ctx.fillStyle = color;
                    this.ctx.font = 'bold 10px "Press Start 2P", monospace';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';

                    const text = obj.type.replace('text_', '').toUpperCase();
                    this.ctx.fillText(text, centerX, centerY);

                    this.ctx.shadowBlur = 0;
                } else {
                    const colors = typeof colorData === 'object' ? colorData : { main: colorData, accent: colorData };

                    // Ombre douce
                    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                    this.ctx.shadowBlur = 5;
                    this.ctx.shadowOffsetY = 3;

                    switch (obj.type) {
                        case 'baba':
                            this.drawBaba(centerX, centerY + offsetY, colors);
                            break;
                        case 'wall':
                            this.drawWall(px, py, colors);
                            break;
                        case 'rock':
                            this.drawRock(centerX, centerY + offsetY, colors);
                            break;
                        case 'flag':
                            this.drawFlag(px, py + offsetY, colors);
                            break;
                        case 'water':
                            this.drawWater(px, py, colors);
                            break;
                        case 'lava':
                            this.drawLava(px, py, colors);
                            break;
                        case 'key':
                            this.drawKey(centerX, centerY + offsetY, colors);
                            break;
                        case 'door':
                            this.drawDoor(px, py, colors);
                            break;
                        case 'skull':
                            this.drawSkull(centerX, centerY + offsetY, colors);
                            break;
                        case 'grass':
                            this.drawGrass(px, py, colors);
                            break;
                        case 'ice':
                            this.drawIce(px, py, colors);
                            break;
                        default:
                            this.ctx.fillStyle = colors.main;
                            this.ctx.fillRect(px + padding, py + padding, size, size);
                    }

                    this.ctx.shadowBlur = 0;
                    this.ctx.shadowOffsetY = 0;

                    // Contour brillant pour YOU
                    if (this.hasProperty(obj.type, 'you')) {
                        this.ctx.strokeStyle = `rgba(255, 105, 180, ${0.5 + Math.sin(this.animationFrame * 0.1) * 0.3})`;
                        this.ctx.lineWidth = 3;
                        this.ctx.strokeRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                    }
                }
            }

            drawBaba(cx, cy, colors) {
                // Corps
                const bodyGradient = this.ctx.createRadialGradient(cx, cy + 3, 0, cx, cy + 3, 14);
                bodyGradient.addColorStop(0, colors.accent);
                bodyGradient.addColorStop(1, colors.main);
                this.ctx.fillStyle = bodyGradient;
                this.ctx.beginPath();
                this.ctx.ellipse(cx, cy + 5, 12, 10, 0, 0, Math.PI * 2);
                this.ctx.fill();

                // Oreilles
                this.ctx.fillStyle = colors.main;
                this.ctx.beginPath();
                this.ctx.ellipse(cx - 6, cy - 10, 4, 10, -0.2, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.beginPath();
                this.ctx.ellipse(cx + 6, cy - 10, 4, 10, 0.2, 0, Math.PI * 2);
                this.ctx.fill();

                // Intérieur oreilles
                this.ctx.fillStyle = '#ffb6c1';
                this.ctx.beginPath();
                this.ctx.ellipse(cx - 6, cy - 9, 2, 6, -0.2, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.beginPath();
                this.ctx.ellipse(cx + 6, cy - 9, 2, 6, 0.2, 0, Math.PI * 2);
                this.ctx.fill();

                // Yeux
                this.ctx.fillStyle = '#ff69b4';
                this.ctx.beginPath();
                this.ctx.arc(cx - 4, cy + 2, 3, 0, Math.PI * 2);
                this.ctx.arc(cx + 4, cy + 2, 3, 0, Math.PI * 2);
                this.ctx.fill();

                // Reflets yeux
                this.ctx.fillStyle = '#fff';
                this.ctx.beginPath();
                this.ctx.arc(cx - 5, cy + 1, 1, 0, Math.PI * 2);
                this.ctx.arc(cx + 3, cy + 1, 1, 0, Math.PI * 2);
                this.ctx.fill();

                // Nez
                this.ctx.fillStyle = '#ffb6c1';
                this.ctx.beginPath();
                this.ctx.arc(cx, cy + 6, 2, 0, Math.PI * 2);
                this.ctx.fill();
            }

            drawWall(px, py, colors) {
                const gradient = this.ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
                gradient.addColorStop(0, colors.accent);
                gradient.addColorStop(1, colors.main);
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);

                // Motif briques
                this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                this.ctx.lineWidth = 2;

                // Ligne horizontale au milieu
                this.ctx.beginPath();
                this.ctx.moveTo(px + 2, py + TILE_SIZE / 2);
                this.ctx.lineTo(px + TILE_SIZE - 2, py + TILE_SIZE / 2);
                this.ctx.stroke();

                // Lignes verticales
                this.ctx.beginPath();
                this.ctx.moveTo(px + TILE_SIZE / 2, py + 2);
                this.ctx.lineTo(px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                this.ctx.stroke();

                this.ctx.beginPath();
                this.ctx.moveTo(px + TILE_SIZE / 4, py + TILE_SIZE / 2);
                this.ctx.lineTo(px + TILE_SIZE / 4, py + TILE_SIZE - 2);
                this.ctx.stroke();

                this.ctx.beginPath();
                this.ctx.moveTo(px + 3 * TILE_SIZE / 4, py + TILE_SIZE / 2);
                this.ctx.lineTo(px + 3 * TILE_SIZE / 4, py + TILE_SIZE - 2);
                this.ctx.stroke();

                // Highlight
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                this.ctx.lineWidth = 1;
                this.ctx.strokeRect(px + 3, py + 3, TILE_SIZE - 8, TILE_SIZE - 8);
            }

            drawRock(cx, cy, colors) {
                const gradient = this.ctx.createRadialGradient(cx - 5, cy - 5, 0, cx, cy, 18);
                gradient.addColorStop(0, colors.accent);
                gradient.addColorStop(1, colors.main);
                this.ctx.fillStyle = gradient;

                // Forme irrégulière
                this.ctx.beginPath();
                this.ctx.moveTo(cx - 12, cy + 5);
                this.ctx.quadraticCurveTo(cx - 15, cy - 5, cx - 8, cy - 12);
                this.ctx.quadraticCurveTo(cx, cy - 16, cx + 10, cy - 10);
                this.ctx.quadraticCurveTo(cx + 16, cy - 3, cx + 12, cy + 8);
                this.ctx.quadraticCurveTo(cx + 5, cy + 14, cx - 5, cy + 12);
                this.ctx.quadraticCurveTo(cx - 14, cy + 10, cx - 12, cy + 5);
                this.ctx.fill();

                // Reflet
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                this.ctx.beginPath();
                this.ctx.ellipse(cx - 5, cy - 5, 4, 3, -0.5, 0, Math.PI * 2);
                this.ctx.fill();
            }

            drawFlag(px, py, colors) {
                const cy = py + TILE_SIZE / 2;

                // Mât
                const matGradient = this.ctx.createLinearGradient(px + TILE_SIZE / 2 - 2, py, px + TILE_SIZE / 2 + 2, py);
                matGradient.addColorStop(0, '#4a3000');
                matGradient.addColorStop(0.5, '#8b6914');
                matGradient.addColorStop(1, '#4a3000');
                this.ctx.fillStyle = matGradient;
                this.ctx.fillRect(px + TILE_SIZE / 2 - 2, py + 6, 4, 28);

                // Drapeau avec animation
                const waveOffset = Math.sin(this.animationFrame * 0.15) * 2;

                const flagGradient = this.ctx.createLinearGradient(px + TILE_SIZE / 2, py + 6, px + TILE_SIZE - 2, py + 15);
                flagGradient.addColorStop(0, colors.accent);
                flagGradient.addColorStop(1, colors.main);
                this.ctx.fillStyle = flagGradient;

                this.ctx.beginPath();
                this.ctx.moveTo(px + TILE_SIZE / 2, py + 6);
                this.ctx.quadraticCurveTo(px + TILE_SIZE / 2 + 10, py + 10 + waveOffset, px + TILE_SIZE - 4, py + 12);
                this.ctx.lineTo(px + TILE_SIZE - 6, py + 22);
                this.ctx.quadraticCurveTo(px + TILE_SIZE / 2 + 8, py + 20 - waveOffset, px + TILE_SIZE / 2, py + 24);
                this.ctx.closePath();
                this.ctx.fill();

                // Étoile sur le drapeau
                this.ctx.fillStyle = '#fff';
                this.drawStar(px + TILE_SIZE / 2 + 10, py + 15, 3, 5, 0.5);
            }

            drawStar(cx, cy, radius, points, innerRadius) {
                this.ctx.beginPath();
                for (let i = 0; i < points * 2; i++) {
                    const r = i % 2 === 0 ? radius : radius * innerRadius;
                    const angle = (i * Math.PI) / points - Math.PI / 2;
                    const x = cx + r * Math.cos(angle);
                    const y = cy + r * Math.sin(angle);
                    if (i === 0) this.ctx.moveTo(x, y);
                    else this.ctx.lineTo(x, y);
                }
                this.ctx.closePath();
                this.ctx.fill();
            }

            drawWater(px, py, colors) {
                const gradient = this.ctx.createLinearGradient(px, py, px, py + TILE_SIZE);
                gradient.addColorStop(0, colors.accent);
                gradient.addColorStop(1, colors.main);
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);

                // Vagues animées
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                this.ctx.lineWidth = 2;

                for (let i = 0; i < 3; i++) {
                    const waveY = py + 10 + i * 10;
                    const offset = Math.sin(this.animationFrame * 0.1 + i) * 3;

                    this.ctx.beginPath();
                    this.ctx.moveTo(px + 4, waveY + offset);
                    this.ctx.quadraticCurveTo(px + 12, waveY - 4 + offset, px + 20, waveY + offset);
                    this.ctx.quadraticCurveTo(px + 28, waveY + 4 + offset, px + 36, waveY + offset);
                    this.ctx.stroke();
                }
            }

            drawLava(px, py, colors) {
                const gradient = this.ctx.createLinearGradient(px, py, px, py + TILE_SIZE);
                gradient.addColorStop(0, colors.accent);
                gradient.addColorStop(0.5, colors.main);
                gradient.addColorStop(1, '#8b0000');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);

                // Bulles animées
                const bubbleTime = this.animationFrame * 0.05;
                for (let i = 0; i < 4; i++) {
                    const bubbleX = px + 8 + (i * 8) + Math.sin(bubbleTime + i * 2) * 3;
                    const bubbleY = py + 30 - ((bubbleTime * 20 + i * 15) % 25);
                    const bubbleSize = 2 + Math.sin(bubbleTime + i) * 1;

                    this.ctx.fillStyle = `rgba(255, 255, 0, ${0.6 + Math.sin(bubbleTime + i) * 0.3})`;
                    this.ctx.beginPath();
                    this.ctx.arc(bubbleX, bubbleY, bubbleSize, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                // Lueur
                this.ctx.shadowColor = '#ff4500';
                this.ctx.shadowBlur = 10;
                this.ctx.strokeStyle = 'rgba(255, 200, 0, 0.5)';
                this.ctx.lineWidth = 2;
                this.ctx.strokeRect(px + 3, py + 3, TILE_SIZE - 6, TILE_SIZE - 6);
                this.ctx.shadowBlur = 0;
            }

            drawKey(cx, cy, colors) {
                this.ctx.shadowColor = colors.main;
                this.ctx.shadowBlur = 10;

                const gradient = this.ctx.createRadialGradient(cx - 3, cy - 8, 0, cx, cy - 5, 10);
                gradient.addColorStop(0, colors.accent);
                gradient.addColorStop(1, colors.main);
                this.ctx.fillStyle = gradient;

                // Tête de la clé
                this.ctx.beginPath();
                this.ctx.arc(cx, cy - 5, 8, 0, Math.PI * 2);
                this.ctx.fill();

                // Trou dans la tête
                this.ctx.fillStyle = '#1a1a2e';
                this.ctx.beginPath();
                this.ctx.arc(cx, cy - 5, 3, 0, Math.PI * 2);
                this.ctx.fill();

                // Tige
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(cx - 2, cy + 2, 4, 14);

                // Dents
                this.ctx.fillRect(cx + 2, cy + 10, 5, 3);
                this.ctx.fillRect(cx + 2, cy + 5, 4, 3);

                this.ctx.shadowBlur = 0;
            }

            drawDoor(px, py, colors) {
                const gradient = this.ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
                gradient.addColorStop(0, colors.accent);
                gradient.addColorStop(1, colors.main);
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(px + 4, py + 2, TILE_SIZE - 8, TILE_SIZE - 4);

                // Cadre
                this.ctx.strokeStyle = '#4a0000';
                this.ctx.lineWidth = 3;
                this.ctx.strokeRect(px + 4, py + 2, TILE_SIZE - 8, TILE_SIZE - 4);

                // Panneau décoratif
                this.ctx.strokeStyle = '#2a0000';
                this.ctx.lineWidth = 2;
                this.ctx.strokeRect(px + 8, py + 6, TILE_SIZE - 16, 12);
                this.ctx.strokeRect(px + 8, py + 22, TILE_SIZE - 16, 10);

                // Poignée
                this.ctx.fillStyle = '#ffd700';
                this.ctx.beginPath();
                this.ctx.arc(px + TILE_SIZE - 10, py + TILE_SIZE / 2, 3, 0, Math.PI * 2);
                this.ctx.fill();
            }

            drawSkull(cx, cy, colors) {
                // Crâne
                const gradient = this.ctx.createRadialGradient(cx, cy - 2, 0, cx, cy, 16);
                gradient.addColorStop(0, colors.accent);
                gradient.addColorStop(1, colors.main);
                this.ctx.fillStyle = gradient;

                // Forme du crâne
                this.ctx.beginPath();
                this.ctx.ellipse(cx, cy - 3, 12, 10, 0, 0, Math.PI * 2);
                this.ctx.fill();

                // Mâchoire
                this.ctx.beginPath();
                this.ctx.ellipse(cx, cy + 8, 8, 5, 0, 0, Math.PI);
                this.ctx.fill();

                // Yeux (orbites noires)
                this.ctx.fillStyle = '#1a1a2e';
                this.ctx.beginPath();
                this.ctx.ellipse(cx - 5, cy - 3, 4, 5, 0, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.beginPath();
                this.ctx.ellipse(cx + 5, cy - 3, 4, 5, 0, 0, Math.PI * 2);
                this.ctx.fill();

                // Lueur rouge dans les yeux
                this.ctx.fillStyle = '#ff0000';
                this.ctx.shadowColor = '#ff0000';
                this.ctx.shadowBlur = 5;
                this.ctx.beginPath();
                this.ctx.arc(cx - 5, cy - 3, 1.5, 0, Math.PI * 2);
                this.ctx.arc(cx + 5, cy - 3, 1.5, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.shadowBlur = 0;

                // Nez
                this.ctx.fillStyle = '#1a1a2e';
                this.ctx.beginPath();
                this.ctx.moveTo(cx, cy + 1);
                this.ctx.lineTo(cx - 2, cy + 5);
                this.ctx.lineTo(cx + 2, cy + 5);
                this.ctx.closePath();
                this.ctx.fill();

                // Dents
                this.ctx.fillStyle = colors.main;
                for (let i = -3; i <= 3; i++) {
                    this.ctx.fillRect(cx + i * 3 - 1, cy + 8, 2, 4);
                }
            }

            drawGrass(px, py, colors) {
                this.ctx.fillStyle = colors.main;
                this.ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);

                // Brins d'herbe
                this.ctx.strokeStyle = colors.accent;
                this.ctx.lineWidth = 2;

                for (let i = 0; i < 6; i++) {
                    const x = px + 6 + i * 5;
                    const waveOffset = Math.sin(this.animationFrame * 0.05 + i) * 2;

                    this.ctx.beginPath();
                    this.ctx.moveTo(x, py + TILE_SIZE - 4);
                    this.ctx.quadraticCurveTo(x + waveOffset, py + TILE_SIZE / 2, x + waveOffset * 2, py + 8);
                    this.ctx.stroke();
                }
            }

            drawIce(px, py, colors) {
                const gradient = this.ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
                gradient.addColorStop(0, colors.accent);
                gradient.addColorStop(0.5, colors.main);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0.8)');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);

                // Reflets
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                this.ctx.beginPath();
                this.ctx.moveTo(px + 8, py + 6);
                this.ctx.lineTo(px + 20, py + 6);
                this.ctx.lineTo(px + 12, py + 14);
                this.ctx.closePath();
                this.ctx.fill();

                // Cristaux
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.moveTo(px + 25, py + 20);
                this.ctx.lineTo(px + 30, py + 15);
                this.ctx.lineTo(px + 35, py + 20);
                this.ctx.moveTo(px + 30, py + 15);
                this.ctx.lineTo(px + 30, py + 25);
                this.ctx.stroke();
            }
        }

        // Démarrer le jeu
        const game = new BabaGame();
    </script>
</body>
</html>
